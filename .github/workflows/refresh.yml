name: Refresh processed data

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip`r`n          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e .
      - name: Collect and process SGS data
        run: python -m bcb_pipeline.cli run
      - name: Commit processed datasets when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv data/processed/*.parquet
          if git diff --cached --quiet; then
            echo "Processed datasets are already up to date."
          else
            git commit -m "chore: refresh processed indicators"
            git push
          fi

